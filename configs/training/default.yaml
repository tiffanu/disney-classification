optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
scheduler:
  name: cosine_annealing
  T_max: 30
  eta_min: 1.0e-6
epochs: 10 # 10 - for local CPU smoke, 30 - for performance
gradient_clip_val: 1.0
early_stopping:
  monitor: val/macro_f1
  patience: 7
  mode: max
checkpoint:
  monitor: val/macro_f1
  mode: max
  save_top_k: 1
  filename: "best-{epoch:02d}-{val/macro_f1:.3f}"
