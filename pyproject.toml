[project]
name = "disney-clf"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pytorch-lightning>=2.2.0",
    "torchmetrics>=1.3.0",
    "mlflow>=2.12.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "dvc>=3.49.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "kaggle>=1.6.0",
    "pandas>=2.2.0",
    "kagglehub>=1.0.1",
    "onnxscript>=0.7.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "pytest>=8.1.0",
    "black>=24.4.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disney_clf"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
